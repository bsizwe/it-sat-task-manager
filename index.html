  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
      <div class="text-center">
        <div class="w-16 h-16 bg-sageGreen rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Moola</h1>
        <p class="text-gray-600 mb-4">AI-Powered P2P Lending</p>
        <div class="flex items-center justify-center space-x-2">
          <div class="w-2 h-2 bg-sageGreen rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-sageGreen rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
          <div class="w-2 h-2 bg-sageGreen rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
        </div>
      </div>
    </div>
    
    <style>
      :root {
        --sage-green: #a2ab81;
        --dark-green: #8a9470;
        --light-green: #b8c299;
      }
      
      .bg-sageGreen {
        background-color: var(--sage-green);
      }
      
      .text-sageGreen {
        color: var(--sage-green);
      }
      
      .border-sageGreen {
        border-color: var(--sage-green);
      }
      
      /* Hide loading screen when app is ready */
      #loading-screen {
        transition: opacity 0.3s ease-out;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      
      ::-webkit-scrollbar-thumb {
        background: var(--sage-green);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: var(--dark-green);
      }
      
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      
      /* Focus styles */
      *:focus {
        outline: 2px solid var(--sage-green);
        outline-offset: 2px;
      }
      
      /* Reduced motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    
    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
          }
        }, 1000);
      });
      
      // Service Worker Registration (for PWA features)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Offline detection
      window.addEventListener('online', function() {
        console.log('App is online');
      });
      
      window.addEventListener('offline', function() {
        console.log('App is offline');
      });
    </script>
  </body>
